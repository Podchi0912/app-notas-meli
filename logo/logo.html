<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mi Cuadernito - Logo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="logo-container">

        <!-- CÍRCULO DECORATIVO -->

        <svg
            class="circle-decoration"
            viewBox="0 0 500 500"
            aria-hidden="true"
        >
            <path
                d="
                M 90 390
                C 25 300, 55 145, 170 75
                C 285 5, 430 55, 470 170
                C 500 255, 475 370, 390 425
                "
            />
        </svg>


        <!-- DECORACIONES SUPERIORES -->

        <div class="sparkle sparkle-left">✦</div>

        <div class="sparkle sparkle-right">✦</div>

        <div class="small-dot dot-one"></div>

        <div class="small-dot dot-two"></div>

        <div class="small-dot dot-three"></div>


        <!-- CORAZÓN SUPERIOR -->

        <div class="big-heart">

            <svg
                viewBox="0 0 100 90"
                aria-hidden="true"
            >
                <path
                    d="
                    M50 82
                    C42 74 7 53 7 27
                    C7 10 27 2 39 14
                    L50 25
                    L61 14
                    C73 2 93 10 93 27
                    C93 53 58 74 50 82
                    Z
                    "
                />
            </svg>

        </div>


        <!-- TEXTO -->

        <div class="brand">

            <div class="brand-mi">

                Mi

                <span class="tiny-heart">♥</span>

            </div>

            <div class="brand-name">
                Cuadernito
            </div>

            <div class="brush-line">

                <span></span>

                <div class="line-heart">
                    ♡
                </div>

            </div>

        </div>


        <!-- ESTRELLITAS -->

        <div class="coral-lines">

            <span></span>
            <span></span>
            <span></span>

        </div>


        <!-- CUADERNITO -->

        <div class="notebook">

            <div class="notebook-cover">

                <div class="notebook-rings">

                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>

                </div>

                <div class="notebook-heart">
                    ♥
                </div>

                <div class="notebook-dashed">
                </div>

            </div>

            <div class="notebook-pages">
            </div>

            <div class="bookmark">
            </div>

        </div>


        <!-- RAMITA -->

        <svg
            class="branch"
            viewBox="0 0 100 150"
            aria-hidden="true"
        >

            <path
                class="branch-line"
                d="
                M45 140
                C50 110 45 80 52 55
                C57 38 68 25 78 10
                "
            />

            <path
                class="branch-line"
                d="
                M51 72
                C35 60 23 58 10 63
                "
            />

            <path
                class="branch-line"
                d="
                M49 91
                C65 79 78 78 90 83
                "
            />

            <path
                class="branch-line"
                d="
                M53 52
                C42 42 35 35 30 26
                "
            />

            <ellipse
                class="leaf"
                cx="20"
                cy="62"
                rx="8"
                ry="15"
                transform="rotate(-75 20 62)"
            />

            <ellipse
                class="leaf"
                cx="82"
                cy="82"
                rx="8"
                ry="15"
                transform="rotate(70 82 82)"
            />

            <ellipse
                class="leaf"
                cx="31"
                cy="30"
                rx="8"
                ry="15"
                transform="rotate(-40 31 30)"
            />

            <ellipse
                class="leaf"
                cx="74"
                cy="20"
                rx="8"
                ry="15"
                transform="rotate(40 74 20)"
            />

        </svg>


        <!-- RAMITA DERECHA CON BOLITAS -->

        <svg
            class="berry-branch"
            viewBox="0 0 100 120"
            aria-hidden="true"
        >

            <path
                d="
                M15 110
                C35 90 45 65 70 25
                "
            />

            <path
                d="
                M42 65
                C60 58 72 48 83 34
                "
            />

            <circle cx="72" cy="24" r="7"/>
            <circle cx="84" cy="34" r="6"/>
            <circle cx="66" cy="47" r="6"/>

        </svg>


        <!-- CORAZÓN PEQUEÑO INFERIOR -->

        <div class="bottom-heart">
            ♡
        </div>

    </div>


</body>
</html>
